<style>

body{width:1280px;height:430px;background:var(--ink);color:var(--paper);font-family:"Inter Tight",sans-serif;overflow:hidden;position:relative}

h1{position:absolute;left:64px;top:108px;font-family:"DM Serif Display",serif;font-weight:400;font-size:84px;line-height:.98;letter-spacing:-.01em}
h1 em{color:var(--signal);font-style:italic}
p{position:absolute;left:66px;top:288px;width:720px;font-size:21px;line-height:1.35;color:#c9c8bf}
.bot{position:absolute;left:66px;right:64px;bottom:32px;display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.bot b{color:var(--paper);font-weight:500}
.seed{position:absolute;right:96px;top:120px;width:260px;height:180px}
